name: CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 11
          os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-11-arm64
    steps:
    - name: Keep LF line endings on checkout
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - uses: actions/checkout@v3

    - name: Set JDK
      uses: actions/setup-java@v3
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
          # No vendor publishes a JDK 8 build for Windows on ARM64, so on that
          # leg install the x64 JDK 8. Windows 11 on ARM runs it through its
          # built-in x64 emulation, still on the windows-11-arm runner.
        architecture: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64' && matrix.java == 8) && 'x64' || '' }}
        cache: 'gradle'

    - name: Build without Scala
      run: ./gradlew build --scan --stacktrace 
        "-Porg.gradle.project.enable_scala=false"

    - name: Build with Scala
      run: ./gradlew build --scan --stacktrace 
        "-Porg.gradle.project.enable_scala=true"
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
